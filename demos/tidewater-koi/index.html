<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12352c" />
    <title>锦鲤池 · WebGPU</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2312352c' width='32' height='32'/%3E%3Cpath fill='%23d24a32' d='M5 17c5-7 16-8 22-2-7 1-13 5-22 2z'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #12352c;
        overflow: hidden;
        color: #e7f2ea;
        font-family: Georgia, "Songti SC", serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: default;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 1.4rem;
        margin: 0;
        text-align: center;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        color: rgba(232, 244, 234, 0.72);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        opacity: 0;
        animation: hint 9s ease forwards;
      }
      #hint[hidden] { display: none; }
      #caveat {
        position: fixed;
        top: 0.7rem;
        right: 0.8rem;
        left: 0.8rem;
        margin: 0;
        text-align: right;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        color: rgba(232, 244, 234, 0.78);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        pointer-events: none;
      }
      @keyframes hint {
        0% { opacity: 0; }
        8% { opacity: 1; }
        70% { opacity: 1; }
        100% { opacity: 0; }
      }
      #err {
        display: none;
        box-sizing: border-box;
        max-width: 36rem;
        margin: 12vh auto;
        padding: 0 1.5rem;
        line-height: 1.55;
      }
      #err h1 { font-weight: normal; font-size: 1.6rem; margin: 0 0 0.6rem; }
      #err a { color: #d7efe2; }
      #perf {
        display: none;
        position: fixed;
        top: 0.6rem;
        left: 0.7rem;
        margin: 0;
        font: 12px/1.4 ui-monospace, monospace;
        color: rgba(232, 244, 234, 0.8);
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #hint { animation: none; opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <canvas id="pond" aria-label="俯视锦鲤池"></canvas>
    <p id="caveat">WebGPU 演示 · 请用 Chrome、Edge 或 Safari · 不是 Lively 壁纸</p>
    <p id="hint">点击水面投喂</p>
    <p id="perf"></p>
    <div id="err" role="alert"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
